services:
  - type: web
    name: sofa-menu
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build:render:guest
    startCommand: npm run start:render:guest
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PREVIEW_PASSWORD
        sync: false
      - key: PUBLIC_APP_URL
        value: https://sofa-menu.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: sofa-menu-db
          property: connectionString
databases:
  - name: sofa-menu-db
    plan: free
    region: oregon
